<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reportes · Control de Mortalidad Avícola</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" aria-label="Navegación principal">
    <div class="brand">
      <div class="mark" aria-hidden="true">CM</div>
      <strong>Mortalidad<br />Avícola</strong>
    </div>

    <ul class="nav-list">
      <li><a href="galpones.html">
        <span class="ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
        </span>
        Galpones
      </a></li>
      <li><a href="reportes.html" class="active">
        <span class="ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"/><path d="M4 19h16"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="8" width="3" height="9"/><rect x="17" y="13" width="3" height="4"/></svg>
        </span>
        Reportes
      </a></li>
    </ul>

    <div class="sidebar-foot">
      <div class="user-row">
        <div class="avatar" id="user-avatar" aria-hidden="true">U</div>
        <span id="user-name">Usuario</span>
      </div>
      <a href="#" id="logout-link">Cerrar sesión</a>
    </div>
  </nav>

  <main class="main">
    <div class="page-head">
      <div>
        <p class="eyebrow">Histórico</p>
        <h1>Reportes de mortalidad</h1>
        <p>Resumen acumulado de todos los registros guardados en este equipo.</p>
      </div>
      <a href="galpones.html" class="btn btn-primary">Nuevo registro</a>
    </div>

    <div class="summary-row" id="summary-row"></div>

    <div class="report-layout">
      <div class="panel">
        <h2>Detalle por registro</h2>
        <div id="table-wrap"></div>
      </div>

      <div class="panel">
        <h2>Mortalidad acumulada por galpón</h2>
        <div class="bar-chart" id="bar-chart"></div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/app.js"></script>
<script>
  requireSession();

  document.getElementById("user-name").textContent = sessionStorage.getItem("mortalidad_user") || "Usuario";
  document.getElementById("user-avatar").textContent = currentUserInitial();

  document.getElementById("logout-link").addEventListener("click", function (e) {
    e.preventDefault();
    sessionStorage.removeItem("mortalidad_user");
    window.location.href = "index.html";
  });

  const records = getRecords().slice().sort((a, b) => (a.timestamp < b.timestamp ? 1 : -1));

  /* ---- Tarjetas resumen ---- */
  const totalCount = records.reduce((sum, r) => sum + r.count, 0);
  const today = todayISO();
  const todayCount = records.filter((r) => r.date === today).reduce((sum, r) => sum + r.count, 0);
  const pensReportedToday = new Set(records.filter((r) => r.date === today).map((r) => r.penId)).size;

  document.getElementById("summary-row").innerHTML = `
    <div class="summary-card alert">
      <div class="label">Mortalidad de hoy</div>
      <div class="value">${todayCount}</div>
    </div>
    <div class="summary-card">
      <div class="label">Mortalidad acumulada</div>
      <div class="value">${totalCount}</div>
    </div>
    <div class="summary-card">
      <div class="label">Galpones reportados hoy</div>
      <div class="value">${pensReportedToday} / ${PENS.length}</div>
    </div>
  `;

  /* ---- Tabla ---- */
  const tableWrap = document.getElementById("table-wrap");

  if (records.length === 0) {
    tableWrap.innerHTML = `<p class="empty-state">Todavía no hay registros guardados. Ve a <strong>Galpones</strong> y registra la primera novedad del día.</p>`;
  } else {
    const rows = records
      .slice(0, 12)
      .map(
        (r) => `
        <tr>
          <td>${r.penName}</td>
          <td>${formatDate(r.date)}</td>
          <td class="num">${r.count}</td>
        </tr>`
      )
      .join("");

    tableWrap.innerHTML = `
      <table class="report-table">
        <thead>
          <tr><th>Galpón</th><th>Fecha</th><th>Cantidad</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  /* ---- Gráfico de barras por galpón ---- */
  const totalsByPen = PENS.map((pen) => ({
    pen,
    total: records.filter((r) => r.penId === pen.id).reduce((sum, r) => sum + r.count, 0),
  }));

  const maxTotal = Math.max(1, ...totalsByPen.map((t) => t.total));
  const chart = document.getElementById("bar-chart");

  chart.innerHTML = totalsByPen
    .map((t) => {
      const heightPct = Math.round((t.total / maxTotal) * 100);
      const isMax = t.total === maxTotal && t.total > 0;
      return `
        <div class="bar-col ${isMax ? "is-max" : ""}">
          <div class="bar" style="height:${Math.max(heightPct, 2)}%;" title="${t.pen.name}: ${t.total}"></div>
          <div class="bar-label">${t.pen.id}</div>
        </div>`;
    })
    .join("");
</script>
</body>
</html>
